user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	client_body_timeout 3600s;
	client_header_timeout 3600s;
	send_timeout 3600s;

	keepalive_timeout 65;
	keepalive_requests 100;

	client_body_buffer_size 128k;
	client_header_buffer_size 1k;
	large_client_header_buffers 4 4k;

	server {
		listen 80;
		listen [::]:80;
		server_name 47.128.3.198;
		
		client_max_body_size 1G;

		location = / {
			return 200 "Server is running. Hosted by Jack L\n";
			add_header Content-Type text/plain;
		}

		location /health {
			access_log off;
			return 200 "healthy\n";
			add_header Content-Type text/plain;
		}
	}

	server {
		listen 80;
		listen [::]:80;
		server_name jackangellucaslabs.top www.jackangellucaslabs.top;
		
		# Allow acme-challenge to bypass HTTPS redirect
		location ^~ /.well-known/acme-challenge/ {
			root /var/www/html;
			allow all;
		}

		location / {
			return 301 https://$server_name$request_uri;
		}
	}

	server {
		listen 443 ssl http2;
		listen [::]:443 ssl http2;
		server_name jackangellucaslabs.top www.jackangellucaslabs.top;

		ssl_certificate /etc/letsencrypt/live/jackangellucaslabs.top/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/jackangellucaslabs.top/privkey.pem;
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		add_header X-Frame-Options DENY;
		add_header X-Content-Type-Options nosniff;
		add_header X-XSS-Protection "1; mode=block";
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

		root /var/www/html;
		index index.html index.htm;

		location / {
			try_files $uri $uri/ =404;
		}

		location /gallery {
			alias /var/www/html/gallery;
			index index.html;
			try_files $uri $uri/ /gallery/index.html;

			location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
				expires 1y;
				add_header Cache-Control "public, immutable";
				add_header X-Content-Type-Options nosniff;
			}

			location ~* \.html$ {
				expires 1h;
				add_header Cache-Control "public";
				add_header X-Content-Type-Options nosniff;
			}
		}

		location /pose {
			alias /var/www/html/pose;
			index pose.html;
			try_files $uri $uri/ /pose/pose.html;

			add_header Permissions-Policy "camera=*, microphone=*, display-capture=*, accelerometer=*, gyroscope=*" always;
			add_header Feature-Policy "camera 'self'; microphone 'self'; display-capture 'self'" always;

			location ~* /pose\.html$ {
				add_header Cache-Control "no-cache, no-store, must-revalidate";
				add_header Pragma "no-cache";
				add_header Expires "0";
				
				add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;
				add_header X-Frame-Options "SAMEORIGIN" always;
			}

			location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
				expires 1y;
				add_header Cache-Control "public, immutable";
				add_header Vary Accept-Encoding;
				add_header X-Content-Type-Options nosniff;
			}
		}

		location /lucky {
			alias /var/www/html/luckydraw;
			index index.html;
			try_files $uri $uri/ /luckydraw/index.html;

			location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
				expires 1y;
				add_header Cache-Control "public, immutable";
				add_header X-Content-Type-Options nosniff;
			}

			location ~* \.html$ {
				expires 1h;
				add_header Cache-Control "public";
				add_header X-Content-Type-Options nosniff;
			}
		}

		location /dd {
			alias /var/www/html/dd;
			index index.html;
			try_files $uri $uri/ /dd/index.html;

			location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
				expires 1y;
				add_header Cache-Control "public, immutable";
				add_header X-Content-Type-Options nosniff;
			}

			location ~* \.html$ {
				expires 1h;
				add_header Cache-Control "public";
				add_header X-Content-Type-Options nosniff;
			}
		}

		location /tank {
			alias /var/www/html/tank;
			index index.html;
			try_files $uri $uri/ /tank/index.html;

			location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
				expires 1y;
				add_header Cache-Control "public, immutable";
				add_header X-Content-Type-Options nosniff;
			}

			location ~* \.html$ {
				expires 1h;
				add_header Cache-Control "public";
				add_header X-Content-Type-Options nosniff;
			}
		}

		location /files {
			alias /tmp/video_download/congliulyc@gmail.com;
			autoindex off;

			add_header Content-Disposition "attachment";
			add_header Cache-Control "no-cache, no-store, must-revalidate";
			add_header Pragma "no-cache";
			add_header Expires "0";

			add_header Accept-Ranges bytes;

			sendfile on;
			tcp_nopush on;
			tcp_nodelay on;
			keepalive_timeout 65;

			output_buffers 2 32k;
			postpone_output 1460;
			
			gzip off;

			access_log /var/log/nginx/youtube_download_access.log;
			error_log /var/log/nginx/youtube_download_error.log;
		}

		access_log /var/log/nginx/domain_access.log;
		error_log /var/log/nginx/domain_error.log;
	}

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
