<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fire Button Test</title>
  <style>
    body {
      padding: 20px;
      font-family: monospace;
    }
    #fire-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #dc3232;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px;
      touch-action: manipulation;
    }
    #fire-btn:active {
      transform: scale(0.9);
    }
    #log {
      background: #f0f0f0;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .info {
      background: #e3f2fd;
      padding: 10px;
      margin: 10px 0;
      border-left: 4px solid #2196f3;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Fire Button Touch Event Test</h2>

  <div class="info">
    <strong>测试目标:</strong> 验证 iPad 上触摸 fire 按钮能否正确触发<br>
    <strong>当前状态:</strong> <span id="shoot-status">未触发</span>
  </div>

  <div id="fire-btn">🔥 FIRE</div>

  <h3>事件日志:</h3>
  <div id="log">等待触摸事件...</div>

  <script>
    const logDiv = document.getElementById('log');
    const statusDiv = document.getElementById('shoot-status');
    const fireBtn = document.getElementById('fire-btn');

    let shootState = false;
    let touchStartTime = 0;
    let getInputCallCount = 0;
    let shootDetected = false;

    function log(message, type = '') {
      const timestamp = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.textContent = `[${timestamp}] ${message}`;
      if (type) entry.className = type;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      logDiv.innerHTML = '';
      log('日志已清空，开始新测试');
    }

    function resetTest() {
      shootState = false;
      shootDetected = false;
      statusDiv.textContent = '未触发';
      statusDiv.className = '';
      clearLog();
    }

    // 模拟 getInput() 函数
    function simulateGetInput() {
      getInputCallCount++;
      const shootNow = shootState;
      shootState = false; // 消费 shoot 标志
      log(`getInput() 调用 #${getInputCallCount}, shoot = ${shootNow}`);
      if (shootNow) {
        shootDetected = true;
        statusDiv.textContent = '✅ 检测到射击';
        statusDiv.className = 'success';
        log('🎯 射击事件被正确捕获！', 'success');
      }
      return { shoot: shootNow };
    }

    // 当前代码的事件处理方式（可能有问题）
    function setupCurrentImplementation() {
      resetTest();
      log('--- 测试当前实现 ---');

      fireBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        touchStartTime = Date.now();
        shootState = true;
        log(`touchstart: shootState = ${shootState}`);
      }, { passive: false });

      fireBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const duration = Date.now() - touchStartTime;
        log(`touchend: 持续 ${duration}ms, shootState 保持 = ${shootState}`);
        // 注意：没有重置 shootState，让 getInput() 来消费
      }, { passive: false });

      fireBtn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        e.stopPropagation();
        log('touchcancel');
      }, { passive: false });
    }

    // 改进版本：添加延迟消费和多次触发检测
    function setupImprovedImplementation() {
      resetTest();
      log('--- 测试改进实现 ---');

      fireBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        touchStartTime = Date.now();
        shootState = true;
        log(`touchstart: shootState = ${shootState}`);
      }, { passive: false });

      fireBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const duration = Date.now() - touchStartTime;
        log(`touchend: 持续 ${duration}ms`);

        // 在 touchend 时也设置一次，以防 touchstart 和 getInput() 之间有竞争
        if (duration < 100) { // 快速点击
          shootState = true;
          log(`touchend: 重新设置 shootState = true (快速点击: ${duration}ms)`);
        }
      }, { passive: false });

      fireBtn.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        e.stopPropagation();
        log('touchcancel');
      }, { passive: false });
    }

    // 替代方案：使用 click 事件
    function setupClickImplementation() {
      resetTest();
      log('--- 测试 Click 事件实现 ---');

      fireBtn.addEventListener('click', (e) => {
        e.preventDefault();
        shootState = true;
        log(`click: shootState = ${shootState}`);
      });
    }

    // 按钮和测试控制
    const controlPanel = document.createElement('div');
    controlPanel.innerHTML = `
      <h3>测试控制:</h3>
      <button onclick="runCurrentTest()">测试当前实现</button>
      <button onclick="runImprovedTest()">测试改进实现</button>
      <button onclick="runClickTest()">测试 Click 实现</button>
      <button onclick="simulateGetInput()">模拟 getInput() 调用</button>
      <button onclick="resetTest()">重置测试</button>
    `;
    document.body.appendChild(controlPanel);

    window.runCurrentTest = () => {
      setupCurrentImplementation();
      setTimeout(() => {
        if (!shootDetected) {
          log('⚠️ 未检测到射击，尝试调用 getInput()...', 'error');
          simulateGetInput();
        }
      }, 200);
    };

    window.runImprovedTest = () => {
      setupImprovedImplementation();
      setTimeout(() => {
        if (!shootDetected) {
          log('⚠️ 未检测到射击，尝试调用 getInput()...', 'error');
          simulateGetInput();
        }
      }, 200);
    };

    window.runClickTest = () => {
      setupClickImplementation();
      setTimeout(() => {
        if (!shootDetected) {
          log('⚠️ 未检测到射击，尝试调用 getInput()...', 'error');
          simulateGetInput();
        }
      }, 200);
    };

    // 自动模拟游戏循环
    function startGameLoop() {
      setInterval(() => {
        if (shootState || shootDetected) {
          simulateGetInput();
        }
      }, 100);
    }

    startGameLoop();
    log('游戏循环已启动 (每100ms调用一次 getInput())');
  </script>
</body>
</html>
